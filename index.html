<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive | Flowers </title>
    <link rel="stylesheet" href="styles/style.css">
    <!-- ------font awesome link-----  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" />
</head>

<body>
    <header>
        <div class="navbar w m-b m-w">
            <img src="assets/logo.png" alt="Responsive|Flowers Website Logo" class="logo">
            <nav>
                <ul>
                    <li><a href="#" id="active">Home</a></li>
                    <li><a href="#">Shop</a></li>
                    <li><a href="#">About Us</a></li>
                </ul>
                <div id="cart">
                    <i class="fa-solid fa-cart-shopping"></i><span>Cart ($56)</span>
                </div>
            </nav>
        </div> <!--this is navbar closing tag -->

        <!-- --------- hero banner --------- -- -->
        <div id="hero-banner" class="w">
            <div class="hero-text m-w">
                <h2 class=".font-noto banner-title"> ALWAYS <span class="text-orange">FRESH <br> FLOWERS</span></h2>
                <p class="description">
                    Indulge your senses with the beauty and fragrance of our fresh flower shop. From classic roses to
                    exotic blooms, we offer a wide variety of fresh flowers that are perfect for any occasion.
                </p>
            </div> <!--this is hero text closing tag-->
            <div class="hero-image">
                <img src="assets/hero-flower.png" alt="A beautiful Flower which is used as a hero banner image">
            </div> <!--this is hero banner closing tag-->
        </div>
    </header>
</body>

</html>
